name: Build Bavalink ZIP

on:
  push:
    branches:
      - build-bavalink-zip-2026-10-04
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ZIP
        run: zip -r Bavalink-2026-10-04.zip . -x ".git/*"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Bavalink-2026-10-04
          path: Bavalink-2026-10-04.zip
          retention-days: 14
